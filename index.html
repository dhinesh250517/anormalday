<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Dharani 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4eefc;--soft:#c9b8e8;--pink:#ff9ec7;--gold:#ffd98a;--bg1:#0b0b2b;--bg2:#2a1750}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(#0b0b2b,#1d1048 60%,#3a1c5e);color:var(--ink);font-family:Quicksand,system-ui,sans-serif}
#sky{position:fixed;inset:0;width:100%;height:100%}
.moon{position:fixed;top:calc(8% + env(safe-area-inset-top,0px));right:10%;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 62% 38%,rgba(190,165,110,.5) 0 9%,transparent 10%),radial-gradient(circle at 38% 64%,rgba(190,165,110,.45) 0 12%,transparent 13%),radial-gradient(circle at 70% 72%,rgba(190,165,110,.4) 0 6%,transparent 7%),radial-gradient(circle at 35% 35%,#fffbe8,#ffe9a8 75%);box-shadow:0 0 40px 12px rgba(255,233,168,.45),0 0 120px 40px rgba(255,200,240,.2);animation:float 8s ease-in-out infinite;opacity:0;transition:opacity 2s}
.moon.on{opacity:1}
@keyframes float{50%{transform:translateY(-8px)}}
.scene{position:fixed;inset:0;display:flex;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity 1.2s;text-align:center}
.scene.on{opacity:1;pointer-events:auto}
.box{margin:auto;width:100%;max-width:440px}
h1,h2{font-family:Caveat,cursive;font-weight:700;margin:.2em 0 .4em}
h1{font-size:2.6rem}h2{font-size:2.2rem}
p{line-height:1.6}
button,input{font:inherit;color:inherit}
.btn{background:linear-gradient(135deg,#ff9ec7,#b58cff);border:0;border-radius:30px;padding:13px 28px;font-weight:600;color:#1b0f3a;cursor:pointer;box-shadow:0 6px 24px rgba(255,158,199,.35);transition:transform .2s}
.btn:active{transform:scale(.95)}
.opt{display:block;width:100%;margin:10px 0;padding:14px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);backdrop-filter:blur(6px);cursor:pointer;transition:.3s}
.opt:hover{background:rgba(255,158,199,.2)}
.fade{opacity:0;transform:translateY(12px);transition:all 1.6s}
.fade.on{opacity:1;transform:none}
/* gate */
.lock{font-size:3.4rem;animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 30px var(--gold)}}
#pw{width:100%;padding:13px 18px;border-radius:30px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);text-align:center;margin:12px 0;outline:none}
.shake{animation:shake .5s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.hint{min-height:1.4em;color:var(--soft);font-size:.9rem}
/* stars scene */
#stars{padding:0}
.qs{position:absolute;background:none;border:0;font-size:2rem;color:#fff;text-shadow:0 0 12px #fff;cursor:pointer;animation:tw 3s ease-in-out infinite;transition:.4s}
.qs.done{color:var(--gold);text-shadow:0 0 18px var(--gold);transform:scale(1.25)}
@keyframes tw{50%{opacity:.45;transform:scale(.85)}}
#bubble{position:fixed;left:0;top:0;width:min(78vw,300px);padding:14px 16px;border-radius:20px;background:rgba(40,20,80,.92);border:1px solid var(--gold);box-shadow:0 0 30px rgba(255,217,138,.4);font-family:Caveat,cursive;font-size:1.6rem;line-height:1.2;opacity:0;pointer-events:none;transition:opacity .35s,transform .4s cubic-bezier(.3,1.6,.5,1);z-index:5;transform-origin:var(--ax) 100%;transform:translate(var(--x),var(--y)) scale(.4)}
#bubble.on{opacity:1;transform:translate(var(--x),var(--y)) scale(1)}
#bubble:after{content:"";position:absolute;left:var(--ax);bottom:-8px;width:14px;height:14px;margin-left:-7px;background:#281450;border:1px solid var(--gold);border-top:0;border-left:0;transform:rotate(45deg)}
#bubble.dn{transform-origin:var(--ax) 0}
#bubble.dn:after{bottom:auto;top:-8px;transform:rotate(225deg)}
#sbot{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));padding:0 20px}
#sbot p{margin:0 0 12px;color:var(--soft)}
#cont{opacity:.35;pointer-events:none}
#cont.ready{opacity:1;pointer-events:auto;animation:glow 2s infinite}
/* envelope */
.env{position:relative;width:280px;height:190px;margin:30px auto;cursor:pointer;transition:all 1.2s;animation:float 5s infinite}
.env .back{position:absolute;inset:0;background:#e9d5ff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.env .front{position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,#f6e6ff 50%,#dcc0f7 50%);clip-path:polygon(0 100%,50% 45%,100% 100%,100% 0,100% 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:60%;background:#d3b3f3;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s;z-index:3}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env .name{position:absolute;bottom:18px;width:100%;text-align:center;font-family:Caveat,cursive;font-size:1.8rem;color:#4b2a7a;z-index:2}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-70%);font-size:2.4rem;z-index:4;transition:.5s;filter:drop-shadow(0 0 8px #c00)}
.env.open .seal{opacity:0;transform:translate(-50%,-70%) scale(2)}
.env.gone{opacity:0;transform:translateY(60px) scale(.8);height:0;margin:0;overflow:hidden}
#letter{display:none;background:#fff8ee;color:#4a3320;border-radius:14px;padding:22px 20px;max-height:68vh;overflow-y:auto;text-align:left;font-family:Caveat,cursive;font-size:1.45rem;line-height:1.45;box-shadow:0 10px 50px rgba(0,0,0,.5)}
#letter p{margin:0 0 .8em;opacity:0;transform:translateY(8px);transition:all 1.2s}
#letter p.on{opacity:1;transform:none}
#lnext{display:none;margin-top:16px}
/* gift */
.gift{position:relative;width:160px;height:170px;margin:40px auto;cursor:pointer;animation:bounce 1.6s infinite}
@keyframes bounce{50%{transform:translateY(-12px)}}
.gb{position:absolute;bottom:0;width:160px;height:110px;background:linear-gradient(#ff7eb3,#e0457b);border-radius:6px}
.gl{position:absolute;bottom:100px;left:-8px;width:176px;height:40px;background:linear-gradient(#ff9ec7,#ec5f93);border-radius:6px;transition:all .8s;z-index:2}
.gb:before,.gl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:var(--gold)}
.gl:after{content:"🎀";position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:2.4rem}
.gift.open{animation:none}
.gift.open .gl{transform:translateY(-90px) rotate(-18deg);opacity:0}
.gift.gone{opacity:0;height:0;margin:0;transition:all 1s}
.pol{display:none;background:#fff;padding:12px 12px 8px;border-radius:6px;box-shadow:0 0 50px rgba(255,200,240,.5);transform:rotate(-2deg);margin:0 auto;width:fit-content;max-width:100%;animation:rise 1.6s both}
@keyframes rise{from{opacity:0;transform:translateY(120px) scale(.6)}}
.pol img{display:block;max-width:100%;max-height:52vh;width:auto;height:auto;border-radius:3px}
.pol .ph{width:240px;height:240px;display:flex;align-items:center;justify-content:center;background:#eee;color:#555;font-size:.9rem;padding:14px}
.pol .cap{font-family:Caveat,cursive;font-size:1.7rem;color:#4a2a6a;margin-top:6px}
#gnext{display:none;margin-top:22px}
.cf{position:fixed;pointer-events:none;font-size:1.4rem;z-index:20}
/* care */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.card{padding:14px 8px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);cursor:pointer;font-size:.9rem}
.card span{display:block;font-size:1.8rem}
#out{min-height:130px;padding:14px;border-radius:20px;background:rgba(0,0,0,.25);margin-bottom:12px}
#out .big{font-size:3rem}
.pulse{animation:pul 1s ease-in-out 3}
.warm{text-shadow:0 0 30px #ff8a3d,0 0 60px #ff6a00}
@keyframes pul{50%{transform:scale(1.4)}}
.br{width:70px;height:70px;border-radius:50%;margin:10px auto;background:radial-gradient(#ffd0ea,#b58cff);animation:br 8s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.9)}}
.moods button{font-size:1.8rem;background:none;border:0;cursor:pointer;margin:0 3px}
/* final */
#fl p{margin:.5em 0;font-family:Caveat,cursive;font-size:1.9rem}
#music{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:30;background:rgba(255,255,255,.12);border:0;border-radius:50%;width:40px;height:40px;font-size:1.1rem;display:none;cursor:pointer}

/* cinematic layer */
.vig{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(transparent 55%,rgba(0,0,12,.7))}
.grain{position:fixed;inset:-50%;z-index:40;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:gr .6s steps(3) infinite}
@keyframes gr{33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}}
.bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:41;pointer-events:none;transition:height 3s ease}
.bar.t{top:0}.bar.b{bottom:0}
body.shut .bar{height:51vh;transition:height 1s ease}
#sky.zoom{animation:zoom 14s ease-out both}
@keyframes zoom{from{transform:scale(1.35)}to{transform:scale(1)}}
#hills{position:fixed;left:0;bottom:0;width:100%;height:17vh;pointer-events:none}
.cloud{position:fixed;width:60vw;height:12vh;border-radius:50%;background:rgba(150,120,220,.13);filter:blur(30px);pointer-events:none;animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(-70vw)}to{transform:translateX(110vw)}}
#pre{position:fixed;left:0;right:0;top:44%;font-family:Caveat,cursive;font-size:2.2rem;color:var(--soft)}
#qt{font-size:3rem;text-shadow:0 0 25px rgba(255,200,240,.6)}
#opts .opt{width:auto;min-width:170px;padding:14px 40px;font-size:1.25rem;border-radius:40px;margin:24px auto 0;border-color:var(--gold);box-shadow:0 0 30px rgba(255,217,138,.3)}

.qs{padding:10px;font-size:2.2rem}
.ring{position:fixed;width:20px;height:20px;margin:-10px;border-radius:50%;border:2px solid var(--gold);z-index:6;pointer-events:none;animation:ring .9s ease-out forwards}
@keyframes ring{to{transform:scale(5);opacity:0}}
#letter{font-size:1.4rem;line-height:34px;padding:8px 20px;background:#fff8ee repeating-linear-gradient(transparent 0 33px,rgba(170,130,90,.22) 33px 34px);background-origin:content-box;background-attachment:local}
#letter p{margin:0 0 34px;opacity:1;transform:none}
#letter p.typing:after{content:"|";margin-left:1px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#out{min-height:160px}
#out h3{font-family:Caveat,cursive;font-size:1.7rem;margin:.1em 0}
.cp{font-size:.95rem;color:var(--soft);animation:fin 1s both;margin:.4em 0 0}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
@media(max-width:420px){h1{font-size:2.2rem}#qt{font-size:2.4rem}.moon{width:76px;height:76px}#pre{font-size:1.9rem}.env{transform-origin:center}}

/* stage: stacked layers */
.stage{display:grid;place-items:center;position:relative}
.stage>*{grid-area:1/1;min-width:0}
/* envelope v2 */
.env{isolation:isolate;margin:30px auto}
.env .front{clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);background:linear-gradient(160deg,#f3e2ff,#d9bbf5)}
.env.open{animation:none}
.env.open .flap{z-index:-1}
.paper{position:absolute;left:14px;right:14px;top:14px;height:170px;border-radius:6px;background:#fffaf0 repeating-linear-gradient(transparent 0 15px,rgba(170,130,90,.25) 15px 16px);box-shadow:0 0 10px rgba(0,0,0,.2);transition:transform 1s cubic-bezier(.3,.9,.3,1)}
.env.pull .paper{transform:translateY(-95px)}
.env.drop{pointer-events:none;transform:translateY(95vh) rotate(8deg);opacity:0;transition:transform 1.3s cubic-bezier(.55,0,.85,.4),opacity 1.3s ease-in}
#letter{display:block;visibility:hidden;min-height:min(55vh,380px)}
#letter.rise{visibility:visible;animation:lrise 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes lrise{from{opacity:0;transform:translateY(90px) scale(.92)}}
/* gift v2 */
.gift{margin:0}
.gift.shake{animation:wig .9s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
.gift:after{content:"";position:absolute;bottom:-14px;left:8%;width:84%;height:16px;background:radial-gradient(rgba(0,0,0,.5),transparent 70%)}
.gift.open .gl{transform:translate(90px,-140px) rotate(30deg);opacity:0;transition:transform .9s cubic-bezier(.2,1.5,.4,1),opacity .9s .15s}
.gift.open .gb:after{content:"";position:absolute;left:8%;right:8%;top:-6px;height:34px;background:radial-gradient(#fff6c8,transparent 70%)}
.gift.away{opacity:0;transform:translateY(50px) scale(.85);transition:opacity 1.2s ease,transform 1.2s ease}
.rays{position:relative;width:min(380px,100%);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(rgba(255,226,150,.3) 0 7deg,transparent 7deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 15%,transparent 68%);mask-image:radial-gradient(circle,#000 15%,transparent 68%);opacity:0;transition:opacity 1s;animation:spin 14s linear infinite;pointer-events:none}
.rays.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.pol{display:block;visibility:hidden;animation:none}
.pol.show{visibility:visible;animation:polin 1.8s cubic-bezier(.2,.9,.3,1) both}
@keyframes polin{0%{opacity:0;transform:translateY(160px) scale(.4) rotate(-14deg)}60%{opacity:1;transform:translateY(-16px) scale(1.05) rotate(3deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(-2deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
/* final moon */
.tmoon{display:block;margin:22px auto 8px;width:92px;height:92px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 62% 38%,rgba(190,165,110,.5) 0 9%,transparent 10%),radial-gradient(circle at 38% 64%,rgba(190,165,110,.45) 0 12%,transparent 13%),radial-gradient(circle at 70% 72%,rgba(190,165,110,.4) 0 6%,transparent 7%),radial-gradient(circle at 35% 35%,#fffbe8,#ffe9a8 75%);box-shadow:0 0 40px 12px rgba(255,233,168,.45),0 0 110px 40px rgba(255,200,240,.2);animation:mp 2.4s ease-in-out infinite}
@keyframes mp{50%{transform:scale(1.08)}}
.tmoon.pop{animation:mpop 1s ease-out}
@keyframes mpop{40%{transform:scale(1.4)}100%{transform:scale(1)}}
#tmh{font-family:Caveat,cursive;font-size:1.9rem;color:var(--gold);margin:.2em 0}
#best .bm{font-family:Caveat,cursive;font-size:2.6rem;margin:.3em 0;color:var(--pink);text-shadow:0 0 20px rgba(255,158,199,.6)}
#best .bw{font-family:Caveat,cursive;font-size:1.9rem;margin:.2em 0;word-break:break-word}
@media(max-width:420px){#fl p{font-size:1.6rem}}

.moon.tap{z-index:35;cursor:pointer;animation:mp2 2s ease-in-out infinite}
@keyframes mp2{50%{transform:scale(1.12);box-shadow:0 0 70px 24px rgba(255,233,168,.75),0 0 160px 60px rgba(255,200,240,.3)}}
.bheart{font-size:4.5rem;filter:drop-shadow(0 0 25px #ff5fa2);animation:hb 1.3s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.bt{font-size:3.2rem;margin:.1em 0 .3em;background:linear-gradient(90deg,#ffd98a,#ff9ec7,#b58cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,158,199,.45))}
.ech{font-family:Caveat,cursive;line-height:1.05;color:#fff;text-shadow:0 0 18px rgba(255,158,199,.7);opacity:0;transform:scale(.7);transition:opacity .8s,transform .8s}
.ech.on{opacity:var(--o);transform:scale(1)}
#bgn{font-family:Caveat,cursive;font-size:1.9rem;color:var(--gold);margin:.8em 0 0}
.rbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,217,138,.65);color:var(--gold);border-radius:40px;padding:12px 32px;font-weight:600;letter-spacing:.06em;backdrop-filter:blur(8px);box-shadow:0 0 24px rgba(255,217,138,.25);cursor:pointer;margin-top:26px}
.rbtn span{display:inline-block;margin-right:8px;transition:transform .7s}
.rbtn:hover span,.rbtn:active span{transform:rotate(-360deg)}

/* ===== cinematic pass ===== */
.scene{filter:blur(12px);transform:scale(1.05);transition:opacity 1.2s,filter 1.2s,transform 1.8s ease-out}
.scene.on{filter:none;transform:none}
.fade{filter:blur(6px)}
.fade.on{filter:blur(0)}
.bheart.fade.on{filter:drop-shadow(0 0 25px #ff5fa2)}
.bt.fade.on{filter:drop-shadow(0 0 18px rgba(255,158,199,.45))}
body.cine .bar{height:4.5vh}
body.cine .scene{padding-top:calc(4.5vh + 20px + env(safe-area-inset-top,0px));padding-bottom:calc(4.5vh + 20px + env(safe-area-inset-bottom,0px))}
body.cine #stars{padding:0}
body.cine #sbot{bottom:calc(4.5vh + 24px + env(safe-area-inset-bottom,0px))}
.leak{position:fixed;inset:-10%;z-index:39;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(55% 40% at 15% 8%,rgba(255,150,120,.13),transparent),radial-gradient(50% 40% at 92% 92%,rgba(120,100,255,.16),transparent);animation:leak 14s ease-in-out infinite alternate}
@keyframes leak{to{transform:translate(4%,3%) scale(1.12);opacity:.55}}
#hills{transform-origin:50% 100%;animation:hz 40s ease-in-out infinite alternate}
@keyframes hz{to{transform:scale(1.07)}}
.moon:before{content:"";position:absolute;left:-230%;right:-230%;top:calc(50% - 1px);height:2px;background:linear-gradient(90deg,transparent,rgba(255,235,190,.5),transparent);filter:blur(1px);pointer-events:none}
.moon:after{content:"";position:absolute;inset:-38%;border-radius:50%;border:1px solid rgba(255,230,180,.14);pointer-events:none}
h1,h2{letter-spacing:.02em;text-shadow:0 0 22px rgba(255,200,240,.35)}
#pre{font-family:Quicksand,system-ui,sans-serif;letter-spacing:.35em;text-transform:uppercase;font-size:.95rem;text-shadow:0 0 14px rgba(255,200,240,.5)}
.gflash{position:relative;width:min(300px,80%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,244,200,.95),rgba(255,200,240,.35) 45%,transparent 70%);opacity:0;pointer-events:none}
.gflash.go{animation:gf 1.6s ease-out forwards}
@keyframes gf{0%{opacity:0;transform:scale(.2)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.9)}}
#mflash{position:fixed;inset:0;z-index:38;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--mx,90%) var(--my,10%),rgba(255,240,200,.95),rgba(255,190,230,.4) 35%,transparent 65%)}
#mflash.go{animation:mf 1.6s ease-in-out}
@keyframes mf{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
#echo{font-family:Caveat,cursive;font-size:2.1rem;line-height:1.35;text-shadow:0 0 18px rgba(255,158,199,.7);margin-top:.3em}
.ew{display:inline-block;opacity:0;transform:translateY(8px) scale(.9);filter:blur(6px);transition:all .9s}
.ew.on{opacity:1;transform:none;filter:none}
@media(max-width:420px){#pre{font-size:.85rem;letter-spacing:.3em}#echo{font-size:1.8rem}}

/* ===== cinematic overhaul ===== */
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;letter-spacing:.01em}
h1{font-size:2.9rem;line-height:1.05}h2{font-size:2.3rem}
#qt{font-size:3.1rem}
.kick{font-size:.7rem;letter-spacing:.55em;text-transform:uppercase;color:var(--gold);opacity:.85;margin:0 0 18px}
.wd{display:inline-block;opacity:0;animation:wr 1.5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes wr{from{opacity:0;filter:blur(10px);transform:translateY(14px) scale(1.08);letter-spacing:.14em}to{opacity:1;filter:blur(0);transform:none;letter-spacing:inherit}}
#chap{position:fixed;left:0;right:0;top:calc(4.5vh + 18px + env(safe-area-inset-top,0px));text-align:center;z-index:36;pointer-events:none;font-size:.7rem;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);opacity:0}
#chap:after{content:"";display:block;width:44px;height:1px;background:var(--gold);margin:10px auto 0;opacity:.6}
#chap.on{animation:chap 4.4s ease-in-out both}
@keyframes chap{0%{opacity:0;letter-spacing:.9em}25%{opacity:.9}75%{opacity:.9}100%{opacity:0;letter-spacing:.5em}}
#motes{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#motes i{position:absolute;bottom:-10px;border-radius:50%;background:rgba(255,230,180,.85);box-shadow:0 0 8px rgba(255,220,160,.9);animation:mrise linear infinite}
@keyframes mrise{from{transform:translate(0,0);opacity:0}15%{opacity:.8}to{transform:translate(45px,-110vh);opacity:0}}
.scene.on .box{animation:push 24s ease-out both}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.06)}}
.btn{position:relative;overflow:hidden;background:rgba(255,217,138,.08);border:1px solid rgba(255,217,138,.7);color:#ffe9b8;letter-spacing:.2em;text-transform:uppercase;font-size:.82rem;padding:14px 32px;box-shadow:0 0 30px rgba(255,217,138,.2),inset 0 0 20px rgba(255,217,138,.08);backdrop-filter:blur(8px)}
.btn:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
#pw{border-radius:0;border:0;border-bottom:1px solid rgba(255,217,138,.6);background:transparent;letter-spacing:.3em;margin:18px 0 10px}
#pw::placeholder{letter-spacing:.18em;opacity:.5;font-size:.85rem}
#count{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;line-height:1.9}
#sttl{position:absolute;left:0;right:0;top:36%;padding:0 26px;text-align:center;pointer-events:none;z-index:3;transition:opacity 2s;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:2.2rem;line-height:1.15;text-shadow:0 0 24px rgba(255,200,240,.5)}
#sttl.out{opacity:0}
.beam{position:absolute;left:50%;top:-30vh;width:340px;height:85vh;margin-left:-170px;background:linear-gradient(180deg,rgba(255,235,200,.3),transparent 85%);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);filter:blur(6px);opacity:0;transition:opacity 3s 1s;pointer-events:none}
#env.on .beam{opacity:1}
.env .flap{transition:transform 1.7s cubic-bezier(.4,0,.2,1)}
.paper{transition:transform 1.7s cubic-bezier(.3,.9,.3,1),box-shadow 1.7s}
.env.pull .paper{box-shadow:0 0 50px 8px rgba(255,225,160,.7)}
.env.open .seal{animation:crack 1s ease-out forwards}
@keyframes crack{0%{transform:translate(-50%,-70%) scale(1)}20%{transform:translate(-50%,-70%) scale(1.3) rotate(-8deg);filter:drop-shadow(0 0 30px #ff7a9c)}100%{transform:translate(-50%,-70%) scale(2.4) rotate(12deg);opacity:0}}
#gift.shk .box{animation:cs .5s}
@keyframes cs{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(2px,2px)}}
.scene.on .card{animation:cin .9s cubic-bezier(.2,.7,.2,1) both;backdrop-filter:blur(10px);background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));box-shadow:0 10px 30px rgba(0,0,0,.35)}
@keyframes cin{from{opacity:0;transform:translateY(24px) scale(.94);filter:blur(6px)}}
#out{backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
#fl p{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:2rem;margin:.55em 0;transition:opacity 1.6s}
#tmh{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.6rem}
#bgn{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.8rem}
#credits{margin-top:18px}
.cr{opacity:0;transition:opacity 1.6s;margin:.8em 0}
.cr.on{opacity:1}
.cr small{display:block;font-size:.62rem;letter-spacing:.45em;text-transform:uppercase;color:var(--soft);margin-bottom:2px}
.cr span{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.3rem}
@media(max-width:420px){h1{font-size:2.4rem}#qt{font-size:2.5rem}#sttl{font-size:1.8rem}#fl p{font-size:1.65rem}.bheart{font-size:3.4rem}}

/* ===== performance + one font + per-scene cinematography ===== */
.scene{filter:none;transform:scale(1.02);transition:opacity 1.2s,transform 1.6s ease-out}
.scene.on{transform:none}
.fade,.fade.on{filter:none}
.scene.on .box{animation:none}
.btn,.opt,#out,.scene.on .card{backdrop-filter:none}
.grain{animation:none;opacity:.06}
.leak{mix-blend-mode:normal;animation:none;opacity:.7}
#hills{animation:none}
.moon:before{filter:none}
.cloud{filter:none;background:radial-gradient(ellipse,rgba(150,120,220,.2),transparent 70%)}
#sky.zoom{animation:zoom 14s ease-out}
.btn:before{left:0;transform:translateX(-150%) skewX(-20deg);animation:sheen2 4.5s ease-in-out infinite}
@keyframes sheen2{0%,60%{transform:translateX(-150%) skewX(-20deg)}100%{transform:translateX(450%) skewX(-20deg)}}
/* mask-reveal titles */
.wm{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.14em 0}
.wd{display:inline-block;opacity:0;transform:translateY(110%);animation:wr 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wr{to{opacity:1;transform:none}}
/* single cinematic font (letter keeps handwriting) */
h1,h2,#qt,#sttl,#fl p,#bgn,#tmh,.bt,#echo,#bubble,.cap,.env .name,.cr span,#ct{font-family:Quicksand,system-ui,sans-serif;font-style:normal;font-weight:500;text-transform:uppercase;letter-spacing:.16em}
h1{font-size:1.9rem;line-height:1.3}h2,#ct{font-size:1.45rem;line-height:1.4}
#qt{font-size:1.9rem;line-height:1.35}
#sttl{font-size:1.3rem;line-height:1.7}
#fl p{font-size:1.1rem;line-height:1.8;letter-spacing:.14em}
#bgn{font-size:1.2rem}#tmh{font-size:.95rem}
.bt{font-size:1.9rem;line-height:1.3}
#echo{font-size:1.15rem;line-height:1.9;letter-spacing:.2em}
#bubble{font-size:1.02rem;line-height:1.5;letter-spacing:.08em;text-transform:none}
.cap{font-size:.95rem}.env .name{font-size:1rem}
.cr span{font-size:1rem}
@media(max-width:420px){h1,#qt,.bt{font-size:1.5rem}h2,#ct{font-size:1.25rem}#sttl{font-size:1.1rem}#fl p{font-size:.98rem;letter-spacing:.12em}#echo{font-size:1rem}.bheart{font-size:3.4rem}}
/* camera moves + colour grade per scene */
#sky,#hills{transition:transform 4s cubic-bezier(.4,0,.2,1)}
body[data-sc=stars] #sky{transform:scale(1.05)}
body[data-sc=env] #sky{transform:translateY(-2%) scale(1.12)}
body[data-sc=gift] #sky{transform:translateX(-2%) scale(1.08)}
body[data-sc=care] #sky{transform:translateY(2%) scale(1.04)}
body[data-sc=final] #sky,body[data-sc=bscene] #sky{transform:translateY(5%) scale(1.2)}
body[data-sc=env] #hills,body[data-sc=gift] #hills{transform:translateY(14%)}
body[data-sc=final] #hills,body[data-sc=bscene] #hills{transform:translateY(30%)}
#grade i{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 3s}
.g-env{background:radial-gradient(70% 55% at 50% 85%,rgba(255,160,80,.3),transparent 70%)}
.g-gift{background:radial-gradient(70% 60% at 50% 50%,rgba(255,110,170,.22),transparent 70%)}
.g-care{background:linear-gradient(180deg,rgba(120,190,230,.12),rgba(180,140,255,.15))}
.g-fin{background:radial-gradient(80% 60% at 50% 20%,rgba(255,217,138,.17),rgba(120,80,200,.2) 60%,transparent)}
body[data-sc=env] .g-env{opacity:1;animation:flick 4s ease-in-out infinite}
body[data-sc=gift] .g-gift,body[data-sc=care] .g-care,body[data-sc=final] .g-fin,body[data-sc=bscene] .g-fin{opacity:1}
@keyframes flick{0%,100%{opacity:.9}20%{opacity:.7}45%{opacity:1}70%{opacity:.8}}
#cons{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="cloud" style="top:22%"></div><div class="cloud" style="top:52%;animation-delay:-35s;animation-duration:90s"></div>
<div id="motes"></div>
<div id="grade"><i class="g-env"></i><i class="g-gift"></i><i class="g-care"></i><i class="g-fin"></i></div>
<svg id="hills" viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 70Q60 40 130 62T260 55T400 60V100H0Z" fill="#0a0722"/><path d="M0 85Q80 62 170 80T330 74T400 80V100H0Z" fill="#05040f"/></svg>
<canvas id="fx"></canvas><div id="mflash"></div><div id="chap"></div><div class="leak"></div><div class="vig"></div><div class="grain"></div><div class="bar t"></div><div class="bar b"></div>
<div class="moon" id="moon"></div>
<button id="music" aria-label="Music">🔇</button>

<!-- GATE -->
<section class="scene on" id="gate"><div class="box">
  <p class="kick">A short film, for one</p>
  <div class="lock">🌙</div>
  <h1>This is only for Dharani</h1>
  <input id="pw" type="password" placeholder="Enter the password" autocomplete="off">
  <div class="hint" id="hint"></div>
  <button class="btn" id="go">Open</button>
</div></section>

<!-- QUESTION -->
<section class="scene" id="q"><div class="box">
  <p class="fade" id="pre"></p>
  <div class="fade" id="qb">
    <h2 id="qt"></h2>
    <div id="opts"></div>
  </div>
</div></section>

<!-- STARS -->
<section class="scene" id="stars">
  <div id="sttl"></div>
  <svg id="cons"><polyline id="cl1" fill="none" stroke="rgba(255,217,138,.18)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline id="cl2" fill="none" stroke="rgba(255,235,190,.9)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div id="field"></div>
  <div id="bubble"></div>
  <div id="sbot">
    <p id="count"></p>
    <button class="btn" id="cont">Continue</button>
  </div>
</section>

<!-- ENVELOPE -->
<section class="scene" id="env"><div class="box">
  <div class="beam"></div>
  <p id="etap" style="color:var(--soft)">Tap the seal to open ✨</p>
  <div class="stage">
    <div class="env" id="envelope"><div class="back"></div><div class="paper"></div><div class="front"></div><div class="flap"></div><div class="seal">💗</div><div class="name" id="ename"></div></div>
    <div id="letter"></div>
  </div>
  <button class="btn" id="lnext">Next 🎁</button>
</div></section>

const $ = id => document.getElementById(id);

function show(id){document.body.dataset.sc=id;document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('on',s.id===id));

/* sky canvas */
const cv=$('sky'),cx=cv.getContext('2d');let W,H,S=[],sh=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;const C2=['#fff','#cfe3ff','#ffe9c9','#ffd0f0'];S=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,p:Math.random()*6.28,s:Math.random()*.02+.005,v:Math.random()*.06+.01,c:C2[Math.floor(Math.random()*4)]}))}
rs();addEventListener('resize',rs);
const FF=Array.from({length:14},()=>({x:Math.random(),y:.6+Math.random()*.25,p:Math.random()*6.28,s:.004+Math.random()*.006}));
(function draw(){
  cx.clearRect(0,0,W,H);
  cx.save();cx.translate(W/2,H/2);cx.rotate(-.5);
  const g=cx.createLinearGradient(0,-H*.18,0,H*.18);
  g.addColorStop(0,'rgba(180,150,255,0)');g.addColorStop(.5,'rgba(200,170,255,.14)');g.addColorStop(1,'rgba(255,170,220,0)');
  cx.fillStyle=g;cx.fillRect(-W,-H*.18,W*2,H*.36);cx.restore();
  S.forEach(s=>{s.p+=s.s;s.x+=s.v;if(s.x>W)s.x=0;cx.globalAlpha=.3+.7*Math.abs(Math.sin(s.p));cx.fillStyle=s.c;
    cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill();if(s.r>1.3){cx.globalAlpha*=.25;cx.beginPath();cx.arc(s.x,s.y,s.r*3,0,6.3);cx.fill()}});
  cx.shadowBlur=0;cx.fillStyle='#fff';
  if(Math.random()<.005)sh.push({x:Math.random()*W*.7,y:Math.random()*H*.4,l:0});
  sh=sh.filter(o=>{o.l++;o.x+=8;o.y+=4;cx.globalAlpha=1-o.l/50;cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.moveTo(o.x,o.y);cx.lineTo(o.x-50,o.y-25);cx.stroke();return o.l<50});
  FF.forEach(f=>{f.p+=f.s*3;const x=(f.x+Math.sin(f.p)*.03)*W,y=(f.y+Math.cos(f.p*1.3)*.02)*H;cx.globalAlpha=.4+.6*Math.abs(Math.sin(f.p*2));cx.fillStyle='#ffe58a';cx.beginPath();cx.arc(x,y,2,0,6.3);cx.fill();cx.globalAlpha*=.25;cx.beginPath();cx.arc(x,y,7,0,6.3);cx.fill()});
  requestAnimationFrame(draw);

      bb.style.setProperty('--x',L+'px');
      bb.style.setProperty('--y',(up?r.top-bh-18:r.bottom+18)+'px');
      bb.style.setProperty('--ax',Math.max(20,Math.min(bw-20,sx-L))+'px');
      bb.classList.add('on');
      clearTimeout(bb.t);bb.t=setTimeout(()=>bb.classList.remove('on'),3400);
      const rg=document.createElement('div');rg.className='ring';rg.style.left=sx+'px';rg.style.top=sy+'px';
      document.body.appendChild(rg);setTimeout(()=>rg.remove(),900);
      if(first){CP.push([sx,sy]);const pts=CP.map(q=>q.join(',')).join(' ');$('cl1').setAttribute('points',pts);$('cl2').setAttribute('points',pts)}
    };
    f.appendChild(b);
  });
  upd();
}

$('envelope').onclick=async function(){
  if(this.classList.contains('open'))return;
  this.classList.add('open');$('etap').style.opacity=0;
  await wait(1700);this.classList.add('pull');
  await wait(1800);this.classList.add('drop');$('letter').classList.add('rise');
  await wait(1100);
  const L=$('letter');L.style.display='block';
  let skip=false;L.onclick=()=>{skip=true};
  const nap=ms=>skip?Promise.resolve():wait(ms);
  for(const line of C.letter){
    const txt=line.replace('FROM',C.from),p=document.createElement('p');
    p.className='on typing';L.appendChild(p);
    for(let i=2;i<=txt.length+1;i+=2){
      const j=Math.min(i,txt.length);
      if(skip){p.textContent=txt;break}
      p.textContent=txt.slice(0,j);if(j%8<2)L.scrollTop=L.scrollHeight;
      await wait(/[.,!?—]/.test(txt.slice(j-2,j))?240:36);
    }
    p.classList.remove('typing');L.scrollTop=L.scrollHeight;
    await nap(900);
  }
  $('lnext').style.display='inline-block';
};

/* gift */

$('photo').onerror=function(){const d=document.createElement('div');d.className='ph';d.textContent='📷 Put your photo next to this file and name it photo.jpg';this.replaceWith(d)};
const FL=['🌸','🌷','🌹','🌼','💮','🌺','💖','✨','🌸','🌷'];
const fx=$('fx'),fc=fx.getContext('2d');let P=[],run=false;
function fxs(){fx.width=innerWidth;fx.height=innerHeight}fxs();addEventListener('resize',fxs);
function spawn(x,y,vx,vy,e){P.push({x,y,vx,vy,r:Math.random()*6.28,vr:(Math.random()-.5)*.12,sz:16+Math.random()*20,e,t:0,life:230+Math.random()*100,ph:Math.random()*6.28});if(!run){run=true;loop()}}
function burst(x,y,n,em){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,v=9+Math.random()*7;spawn(x,y,Math.cos(a)*v,Math.sin(a)*v,em[i%em.length])}}
function rain(ms,l=FL){const id=setInterval(()=>spawn(Math.random()*innerWidth,-30,(Math.random()-.5)*1.5,3+Math.random()*2,l[Math.floor(Math.random()*l.length)]),110);setTimeout(()=>clearInterval(id),ms)}
function loop(){
  fc.clearRect(0,0,fx.width,fx.height);
  P=P.filter(p=>{p.t++;p.vy+=.14;p.vx*=.95;p.vy*=.97;p.x+=p.vx+Math.sin(p.t*.05+p.ph)*.9;p.y+=p.vy;p.r+=p.vr;
    const al=Math.min(1,(p.life-p.t)/60);if(al<=0||p.y>fx.height+40)return false;
    fc.save();fc.globalAlpha=al;fc.translate(p.x,p.y);fc.rotate(p.r);fc.font=p.sz+'px serif';fc.textAlign='center';fc.textBaseline='middle';fc.fillText(p.e,0,0);fc.restore();return true});
  if(P.length)requestAnimationFrame(loop);else run=false;
}
